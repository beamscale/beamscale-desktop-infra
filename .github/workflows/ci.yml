name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: python scripts/test_cli_roles.py
      - run: python -m json.tool appliance.json >/dev/null
      - run: bash -n scripts/doctor.sh scripts/bootstrap.sh scripts/up.sh scripts/down.sh scripts/status.sh scripts/install-service.sh scripts/uninstall-service.sh
      - name: Parse PowerShell lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "scripts/bootstrap.ps1",
            "scripts/doctor.ps1",
            "scripts/up.ps1",
            "scripts/down.ps1",
            "scripts/status.ps1",
            "services/windows/install.ps1",
            "services/windows/uninstall.ps1"
          )) {
            [void][scriptblock]::Create((Get-Content -Raw $path))
          }
      - name: enforce documented origin matches manifest
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'appliance.json').read_text())
          origin=manifest['host']['public_origin']
          readme=(root/'README.md').read_text()
          cloudflare=(root/'cloudflare/config.example.yml').read_text()
          assert origin in readme, f'{origin} missing from README'
          assert origin in cloudflare, f'{origin} missing from cloudflare config'
          PY
      - name: validate service-manager state wiring
        run: |
          set -euo pipefail
          grep -F 'BMSCL_DESKTOP_HOME=__RUNTIME_DIR__' services/linux/beamscale-desktop-daemon.service
          grep -F 'ExecStart=__BINARY__' services/linux/beamscale-desktop-daemon.service
          grep -F '__STATE_DIR__' services/linux/beamscale-desktop-daemon.service
          grep -F '<key>BMSCL_DESKTOP_HOME</key><string>__RUNTIME_DIR__</string>' services/macos/com.beamscale.desktop-daemon.plist
          grep -F '__BINARY__' services/macos/com.beamscale.desktop-daemon.plist
          grep -F 'BMSCL_DESKTOP_HOME' services/windows/install.ps1
          grep -F '127.0.0.1:9587' services/windows/install.ps1
      - name: ensure one desired-state authority
        run: test ! -e appliance.toml
      - name: reject duplicate service trees
        run: test ! -d service
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
