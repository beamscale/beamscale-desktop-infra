name: Zed pkg local-link audit

on:
  push:
    branches:
      - test/zed-pkg-local-links-528
  workflow_dispatch:

permissions:
  contents: read

env:
  ZED_SHA: dfffc376331849d23f443c0288184fa17a47e904

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact zed-pkg/zed-cli revision
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch DEN-3488-explicit-local-links https://github.com/zed-pkg/zed-cli.git zed-cli
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_SHA"
      - name: Toolchain
        run: rustup show
      - name: Format
        working-directory: zed-cli
        run: cargo fmt --all -- --check
      - name: Check
        working-directory: zed-cli
        run: cargo check --all-targets --locked
      - name: Local-link tests
        working-directory: zed-cli
        run: cargo test --locked linking::tests -- --nocapture
      - name: Clippy
        working-directory: zed-cli
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: npm-link-equivalent CLI smoke test
        working-directory: zed-cli
        run: |
          set -euxo pipefail
          cargo build --locked --bin zed
          BIN="$PWD/target/debug/zed"
          ROOT="$RUNNER_TEMP/zed-link-e2e"
          HOME_DIR="$ROOT/home"
          SOURCE="$ROOT/source"
          CONSUMER="$ROOT/consumer"
          mkdir -p "$SOURCE" "$CONSUMER"
          cat > "$SOURCE/.zpkg.toml" <<'EOF'
          [package]
          org = "acme"
          name = "widget"
          version = "0.1.0"
          EOF
          cat > "$CONSUMER/.zpkg.toml" <<'EOF'
          [package]
          org = "acme"
          name = "consumer"
          version = "0.1.0"
          EOF
          printf 'one\n' > "$SOURCE/live.txt"
          (cd "$SOURCE" && ZED_PKG_HOME="$HOME_DIR" "$BIN" link .)
          (cd "$CONSUMER" && ZED_PKG_HOME="$HOME_DIR" "$BIN" link acme/widget --adapter none)
          test -L "$CONSUMER/zed_modules/acme/widget"
          test "$(cat "$CONSUMER/zed_modules/acme/widget/live.txt")" = one
          printf 'two\n' > "$SOURCE/live.txt"
          test "$(cat "$CONSUMER/zed_modules/acme/widget/live.txt")" = two
          rm -rf "$SOURCE"
          test -L "$CONSUMER/zed_modules/acme/widget"
          (cd "$CONSUMER" && ZED_PKG_HOME="$HOME_DIR" "$BIN" unlink acme/widget)
          test ! -L "$CONSUMER/zed_modules/acme/widget"
