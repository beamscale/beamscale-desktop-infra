name: generation-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Validate generation lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/generation-contract-validator/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/generation-contract-validator/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/generation-contract-validator/Cargo.toml
          cargo run --quiet --manifest-path tools/generation-contract-validator/Cargo.toml -- ores-generation-contract.json
