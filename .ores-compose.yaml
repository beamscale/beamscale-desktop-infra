schema_version: ores.compose.v1
project: beamscale-desktop
allow_lazy_start: false
source:
  repository: https://github.com/beamscale/beamscale-desktop-daemon.git
  commit: c37d8865567c3e0f1e609fd781cdc20bc4a5be07
  checkout_dir: tmp/dev/beamscale-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release", "--locked"]
    command: ["./target/release/beamscale-desktop-daemon"]
    environment:
      BMSCL_DAEMON_LISTEN: "127.0.0.1:9587"
      BMSCL_LOCAL_INGRESS_URL: "http://127.0.0.1:8080"
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:9587/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
