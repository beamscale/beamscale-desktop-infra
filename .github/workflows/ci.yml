name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: python scripts/test_cli_roles.py
      - run: python -m json.tool appliance.json >/dev/null
      - run: bash -n scripts/doctor.sh scripts/bootstrap.sh scripts/up.sh scripts/down.sh scripts/status.sh scripts/install-service.sh scripts/uninstall-service.sh
      - name: Parse PowerShell lifecycle scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "scripts/bootstrap.ps1",
            "scripts/doctor.ps1",
            "scripts/up.ps1",
            "scripts/down.ps1",
            "scripts/status.ps1",
            "scripts/install-service.ps1",
            "scripts/uninstall-service.ps1"
          )) {
            [void][scriptblock]::Create((Get-Content -Raw $path))
          }
      - name: enforce documented origin matches manifest
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'appliance.json').read_text())
          origin=manifest['host']['public_origin']
          readme=(root/'README.md').read_text()
          cloudflare=(root/'cloudflare/config.example.yml').read_text()
          assert origin in readme, f'{origin} missing from README'
          assert origin in cloudflare, f'{origin} missing from cloudflare config'
          PY
      - name: validate Rust service-manager authority
        run: |
          set -euo pipefail
          grep -F 'BMSCL_SERVICE_BINARY' scripts/install-service.sh scripts/uninstall-service.sh
          grep -F 'BMSCL_SERVICE_BINARY' scripts/install-service.ps1 scripts/uninstall-service.ps1
          grep -F 'beamscale-service' scripts/bootstrap.sh scripts/bootstrap.ps1
          if grep -REn '\\b(systemctl|launchctl|schtasks|Register-ScheduledTask|New-ScheduledTask)\\b'             scripts/install-service.sh scripts/uninstall-service.sh             scripts/install-service.ps1 scripts/uninstall-service.ps1; then
            echo "service wrappers must delegate to Rust beamscale-service" >&2
            exit 1
          fi
      - name: ensure one desired-state authority
        run: test ! -e appliance.toml
      - name: reject duplicate service-manager trees
        run: |
          test ! -d service
          test ! -d services
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
