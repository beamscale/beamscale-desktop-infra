name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_manifest.py
      - run: bash -n scripts/bootstrap.sh scripts/doctor.sh scripts/up.sh scripts/down.sh
      - name: Validate plist XML
        run: python3 -c 'import xml.etree.ElementTree as ET; ET.parse("services/macos/com.beamscale.desktop-daemon.plist")'
      - name: Production infra must not be a dependency
        run: |
          ! grep -R "clone.*bmscl-infra\|beamscale/bmscl-infra.git" -n scripts appliance.json services cloudflare
      - name: Cloudflare terminates directly at loopback BEAM ingress
        run: grep -F "service: http://127.0.0.1:8081" cloudflare/config.example.yml
