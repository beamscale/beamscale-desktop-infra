name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manifest.py
      - run: bash -n scripts/doctor.sh scripts/bootstrap.sh scripts/up.sh scripts/down.sh scripts/status.sh
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/bootstrap.ps1)) | Out-Null'
      - name: ensure one desired-state authority
        run: test ! -e appliance.toml
      - name: reject duplicate service trees
        run: test ! -d service
      - name: reject obvious committed secrets
        run: |
          if git grep -nEI '(api[_-]?token|password|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' -- ':!*.example'; then exit 1; else exit 0; fi
